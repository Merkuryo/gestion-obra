{% extends "base.html" %}
{% block contenido %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% if empresa.logo %}<img src="{{ empresa.logo.url }}" alt="" class="d-block mx-auto mb-3" height="48">{% endif %}
        <h1 class="h5 text-center mb-4">{{ empresa|default:"Gestión de obra" }}</h1>
        {% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label" for="u">Usuario</label>
            <input class="form-control" id="u" name="username" autofocus required></div>
          <div class="mb-3"><label class="form-label" for="p">Contraseña</label>
            <input class="form-control" id="p" type="password" name="password" required></div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
