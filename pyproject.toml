[project]
name = "gestion-obra"
version = "0.1.0"
description = "Gestión de obra para contratas y subcontratas de cualquier oficio de la construcción (Django)"
license = "LicenseRef-Proprietary"
authors = [{ name = "Merkuryo" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --reuse-db --ds=config.settings.test"
