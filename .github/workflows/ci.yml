name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: obra
          POSTGRES_USER: obra
          POSTGRES_PASSWORD: obra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-no-secreto
      DATABASE_URL: postgres://obra:obra@localhost:5432/obra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
